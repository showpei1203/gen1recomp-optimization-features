name: M6A2 FIX3 THOR Audio Pacing APK

on:
  push:
    branches: [ feature/soulgold-showdown-m6a2 ]
    paths:
      - 'android/m6a2/**'
      - '.github/workflows/m6a2-thor-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m6a2-thor-runtime
  cancel-in-progress: true

jobs:
  build-runtime-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned mGBA
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: 507061afd70489a0c2ffc8ba26d8f9b53d6cf7d6
          path: _mgba

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build pieces
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build

      - name: Build mGBA libretro arm64-v8a
        shell: bash
        run: |
          set -euxo pipefail
          SDK_CMAKE="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          "$SDK_CMAKE" -S _mgba -B _mgba_build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRETRO=ON \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF \
            -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF \
            -DSKIP_LIBRARY=ON -DDISABLE_DEPS=ON \
            -DENABLE_DEBUGGERS=OFF -DENABLE_GDB_STUB=OFF -DENABLE_SCRIPTING=OFF \
            -DM_CORE_GBA=ON -DM_CORE_GB=OFF \
            -DBUILD_LTO=OFF
          "$SDK_CMAKE" --build _mgba_build --target mgba_libretro -j2
          CORE="$(find _mgba_build -type f -name 'mgba_libretro.so' | head -1)"
          test -n "$CORE" && test -s "$CORE"
          mkdir -p android/m6a2/app/src/main/jniLibs/arm64-v8a
          cp "$CORE" android/m6a2/app/src/main/jniLibs/arm64-v8a/libmgba_libretro.so
          file android/m6a2/app/src/main/jniLibs/arm64-v8a/libmgba_libretro.so

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate FIX3 conservative audio contract
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'android:extractNativeLibs="true"' android/m6a2/app/src/main/AndroidManifest.xml
          grep -q 'useLegacyPackaging true' android/m6a2/app/build.gradle
          grep -q "versionName 'M6A2-FIX3'" android/m6a2/app/build.gradle
          grep -q 'frameBudget+=dt\*coreFps' android/m6a2/app/src/main/java/com/showpei/soulgold/m6a2/MainActivity.java
          grep -q 'AudioTrack.WRITE_NON_BLOCKING' android/m6a2/app/src/main/java/com/showpei/soulgold/m6a2/MainActivity.java
          grep -q 'prefillShorts' android/m6a2/app/src/main/java/com/showpei/soulgold/m6a2/MainActivity.java
          grep -q 'pendingSize' android/m6a2/app/src/main/java/com/showpei/soulgold/m6a2/MainActivity.java
          grep -q 'effective_generated_source_rate' android/m6a2/app/src/main/java/com/showpei/soulgold/m6a2/MainActivity.java
          grep -q 'menu_presentation_changed_by_fix3' android/m6a2/app/src/main/java/com/showpei/soulgold/m6a2/MainActivity.java
          grep -q 'nativeAudioDroppedSamples' android/m6a2/app/src/main/cpp/native_bridge.cpp
          ! grep -q 'SoulGold-M6A2-Emu' android/m6a2/app/src/main/java/com/showpei/soulgold/m6a2/MainActivity.java
          ! grep -q 'AudioTrack.WRITE_BLOCKING' android/m6a2/app/src/main/java/com/showpei/soulgold/m6a2/MainActivity.java

      - name: Build M6A2 FIX3 debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle -p android/m6a2 :app:assembleDebug --no-daemon

      - name: Verify runtime libraries in APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=android/m6a2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libmgba_libretro.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libsoulgold_m6a2.so' /tmp/apk-list.txt

      - name: Package THOR FIX3 runtime artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/m6a2
          APK=artifacts/m6a2/SOULGOLD_M6A2_FIX3_THOR_AUDIO_PACING.apk
          cp android/m6a2/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          stat -c '%s' "$APK" > "$APK.bytes"
          base64 -w0 "$APK" > "$APK.b64"
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=Path('artifacts/m6a2/SOULGOLD_M6A2_FIX3_THOR_AUDIO_PACING.apk')
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
          out={
            'milestone':'M6A2_FIX3',
            'artifact':apk.name,
            'bytes':apk.stat().st_size,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'abi':'arm64-v8a',
            'mgba_pinned_commit':'507061afd70489a0c2ffc8ba26d8f9b53d6cf7d6',
            'contains_mgba_libretro':'lib/arm64-v8a/libmgba_libretro.so' in names,
            'contains_runtime_bridge':'lib/arm64-v8a/libsoulgold_m6a2.so' in names,
            'fix2_audio_worker_rejected':True,
            'choreographer_timestamp_accumulator':True,
            'partial_audio_write_retention':True,
            'audio_prefill':True,
            'menu_presentation_changes':False,
            'rom_included':False,
            'runtime_device_pass':'PENDING_USER_THOR_TEST'
          }
          Path('artifacts/m6a2/M6A2_RUNTIME_BUILD.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOULGOLD_M6A2_FIX3_THOR_AUDIO_PACING
          path: |
            artifacts/m6a2/SOULGOLD_M6A2_FIX3_THOR_AUDIO_PACING.apk
            artifacts/m6a2/SOULGOLD_M6A2_FIX3_THOR_AUDIO_PACING.apk.sha256
            artifacts/m6a2/M6A2_RUNTIME_BUILD.json
          if-no-files-found: error

      - name: Persist compact APK transport and build evidence
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/m6a2/SOULGOLD_M6A2_FIX3_THOR_AUDIO_PACING.apk.b64 \
                  artifacts/m6a2/SOULGOLD_M6A2_FIX3_THOR_AUDIO_PACING.apk.sha256 \
                  artifacts/m6a2/SOULGOLD_M6A2_FIX3_THOR_AUDIO_PACING.apk.bytes \
                  artifacts/m6a2/M6A2_RUNTIME_BUILD.json
          if ! git diff --cached --quiet; then
            git commit -m 'M6A2 FIX3 persist THOR audio pacing APK transport'
            git fetch origin feature/soulgold-showdown-m6a2
            git rebase origin/feature/soulgold-showdown-m6a2
            git push origin HEAD:feature/soulgold-showdown-m6a2
          fi
