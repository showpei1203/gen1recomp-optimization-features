name: SoulGold Showdown Bulk Migration Batch 0

on:
  workflow_dispatch:
  push:
    branches:
      - feature/showdown-animated-battlers
    paths:
      - "tools/prepare_soulgold_showdown_bulk_batch.py"
      - "tools/showdown_tile_delta_pack.py"
      - "prototype/soulgold_showdown_s1/showdown_gba_runtime.c"
      - "prototype/soulgold_showdown_s1/showdown_gba_runtime.h"
      - "tools/emit_soulgold_showdown_s1_c.py"
      - ".github/workflows/soulgold-showdown-bulk-batch0.yml"

env:
  SOULGOLD_REV: 77ec3fc6275bb94dd703f4c1976f1457cc44a60b
  SHOWDOWN_SPRITES_URL: https://www.pokemonshowdown.com/files/resources/sprites.zip
  BATCH_INDEX: 0
  BATCH_SIZE: 32

jobs:
  convert-batch-0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework
      - name: Checkout SoulGold v1.0.5 authority
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pil curl unzip build-essential libpng-dev
      - name: Download official Showdown sprites
        run: |
          mkdir -p source evidence
          curl --fail --location --retry 3 --retry-delay 2 "$SHOWDOWN_SPRITES_URL" --output source/sprites.zip
          test -s source/sprites.zip
      - name: Generate current full catalog
        run: |
          python3 framework/tools/showdown_bulk_catalog.py \
            --sprites-zip source/sprites.zip \
            --soulgold soulgold \
            --output-json evidence/SHOWDOWN_SOULGOLD_FULL_CATALOG.json \
            --output-csv evidence/SHOWDOWN_SOULGOLD_FULL_CATALOG.csv \
            | tee evidence/SHOWDOWN_SOULGOLD_FULL_CATALOG_SUMMARY.txt
      - name: Convert deterministic batch 0
        run: |
          python3 framework/tools/prepare_soulgold_showdown_bulk_batch.py \
            --framework-root framework \
            --catalog evidence/SHOWDOWN_SOULGOLD_FULL_CATALOG.json \
            --sprites-zip source/sprites.zip \
            --soulgold soulgold \
            --output bulk_batch_0 \
            --batch-index "$BATCH_INDEX" \
            --batch-size "$BATCH_SIZE" \
            | tee evidence/SHOWDOWN_BULK_BATCH_000_CONVERT.log
      - name: Structural audit
        run: |
          test -f bulk_batch_0/SHOWDOWN_BULK_BATCH_000_SUMMARY.json
          test "$(find bulk_batch_0/staging/src -maxdepth 1 -name 'showdown_*_idle.c' | wc -l)" -eq "$BATCH_SIZE"
          test "$(find bulk_batch_0/staging/graphics/showdown -name manifest.json | wc -l)" -eq "$((BATCH_SIZE * 2))"
          ! grep -R 'PmdSoulGold\|PmdGba\|pmd_' -n bulk_batch_0/staging/src
      - name: Measure real GBA LZ frame budget
        run: |
          make -C soulgold -f make_tools.mk tools/gbagfx
          mkdir -p soulgold/graphics/showdown
          cp -a bulk_batch_0/staging/graphics/showdown/. soulgold/graphics/showdown/
          cd soulgold
          find graphics/showdown -name 'frame_*.png' -print0 | \
            xargs -0 -P"$(nproc)" -n1 bash -c '
              p="$1"
              raw="${p%.png}.4bpp"
              lz="${raw}.lz"
              tools/gbagfx/gbagfx "$p" "$raw"
              tools/gbagfx/gbagfx "$raw" "$lz"
            ' _
          cd ..
          python3 - <<'PY' | tee evidence/SHOWDOWN_BULK_BATCH_000_GBA_LZ_BUDGET.json
          import json
          from pathlib import Path
          catalog=json.loads(Path('evidence/SHOWDOWN_SOULGOLD_FULL_CATALOG.json').read_text())
          root=Path('soulgold/graphics/showdown')
          files=list(root.rglob('frame_*.4bpp.lz'))
          lz_bytes=sum(p.stat().st_size for p in files)
          raw_bytes=len(files)*2048
          full_normal_raw=0
          full_normal_frames=0
          for row in catalog['rows']:
              if row.get('runtime_candidate', row.get('runtime_exact_candidate', False)):
                  full_normal_raw += int(row['front_raw_4bpp_bytes']) + int(row['back_raw_4bpp_bytes'])
                  full_normal_frames += int(row['front_frames']) + int(row['back_frames'])
          ratio=(lz_bytes/raw_bytes) if raw_bytes else 0
          out={
              'batch_index':0,
              'species':32,
              'compressed_frame_files':len(files),
              'batch_raw_4bpp_bytes':raw_bytes,
              'batch_gba_lz_bytes':lz_bytes,
              'gba_lz_ratio':round(ratio,6),
              'full_candidate_normal_front_back_frames':full_normal_frames,
              'full_candidate_normal_front_back_raw_bytes':full_normal_raw,
              'full_candidate_normal_front_back_raw_mib':round(full_normal_raw/1048576,3),
              'full_candidate_normal_front_back_estimated_gba_lz_bytes_at_batch0_ratio':round(full_normal_raw*ratio),
              'full_candidate_normal_front_back_estimated_gba_lz_mib_at_batch0_ratio':round(full_normal_raw*ratio/1048576,3),
              'note':'Estimate uses batch-0 compression ratio; tile-delta audit below is the preferred full-ROM direction.'
          }
          print(json.dumps(out,indent=2))
          PY
      - name: Measure tile-delta GBA storage
        run: |
          python3 framework/tools/showdown_tile_delta_pack.py \
            --graphics-root bulk_batch_0/staging/graphics/showdown \
            --output delta_batch_0 \
            --gbagfx soulgold/tools/gbagfx/gbagfx \
            | tee evidence/SHOWDOWN_BULK_BATCH_000_TILE_DELTA_SUMMARY.txt
          cp delta_batch_0/SHOWDOWN_TILE_DELTA_BUDGET.json evidence/SHOWDOWN_BULK_BATCH_000_TILE_DELTA_BUDGET.json
      - name: Upload install-ready converted batch
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-Showdown-Bulk-Batch-000-InstallReady
          if-no-files-found: error
          compression-level: 6
          path: |
            bulk_batch_0/staging
            bulk_batch_0/SHOWDOWN_BULK_BATCH_000_SUMMARY.json
            evidence/SHOWDOWN_SOULGOLD_FULL_CATALOG_SUMMARY.txt
            evidence/SHOWDOWN_BULK_BATCH_000_CONVERT.log
            evidence/SHOWDOWN_BULK_BATCH_000_GBA_LZ_BUDGET.json
            evidence/SHOWDOWN_BULK_BATCH_000_TILE_DELTA_SUMMARY.txt
            evidence/SHOWDOWN_BULK_BATCH_000_TILE_DELTA_BUDGET.json
