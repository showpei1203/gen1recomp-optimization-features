name: Extract Anil v1.0.23 exact Summary reference

on:
  push:
    paths:
      - '.github/workflows/extract-anil-v1023-summary-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/Juvenal-Yescas/mediafire-dl.git'
      - name: Download exact Anil DE 1.0.23 English
        run: |
          set -euxo pipefail
          mkdir -p /tmp/anil
          python - <<'PY'
          import mediafire_dl
          url='https://www.mediafire.com/file/vqvq1km2qtp4yn9/Pokemon+Anil+DE+1.0.23+ENGLISH.zip/file'
          out='/tmp/anil/anil.zip'
          if not mediafire_dl.download(url,out,quiet=False):
              raise SystemExit('download failed')
          PY
          test $(stat -c%s /tmp/anil/anil.zip) -gt 500000000
      - name: Extract exact Summary runtime reference
        run: |
          set -euxo pipefail
          mkdir -p /tmp/anil/full /tmp/ref
          unzip -q /tmp/anil/anil.zip -d /tmp/anil/full
          SCRIPTS=$(find /tmp/anil/full -type f -path '*/Data/Scripts.rxdata' | head -n1)
          ROOT=$(dirname "$(dirname "$SCRIPTS")")
          echo "ROOT=$ROOT"
          test -d "$ROOT/Graphics/UI/Summary"
          mkdir -p /tmp/ref/Data /tmp/ref/Graphics/UI
          cp "$ROOT/Data/Scripts.rxdata" /tmp/ref/Data/
          cp "$ROOT/Data/PluginScripts.rxdata" /tmp/ref/Data/
          cp -a "$ROOT/Graphics/UI/Summary" /tmp/ref/Graphics/UI/
          {
            echo "EXACT_BASELINE=Pokemon Anil DE 1.0.23 ENGLISH"
            echo "SOURCE_SHA256=$(sha256sum /tmp/anil/anil.zip | awk '{print $1}')"
            echo "SUMMARY_FILES=$(find /tmp/ref/Graphics/UI/Summary -type f | wc -l)"
            echo
            find /tmp/ref/Graphics/UI/Summary -type f -printf '%P\n' | sort
          } > /tmp/ref/MANIFEST.txt
          find /tmp/ref/Graphics/UI/Summary -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ref/SUMMARY_SHA256.txt
          for f in bg_info bg_memo bg_skills bg_moves bg_allstats bg_1 bg_2 bg_3 bg_4 bg_5 page_memo; do
            echo "== $f ==" >> /tmp/ref/KEY_FILES.txt
            find /tmp/ref/Graphics/UI/Summary -maxdepth 1 -type f -iname "$f.*" -printf '%f %s bytes\n' >> /tmp/ref/KEY_FILES.txt || true
          done
          cat /tmp/ref/KEY_FILES.txt
      - name: Package exact reference
        run: |
          cd /tmp/ref
          zip -qr /tmp/ANIL_V1023_EXACT_SUMMARY_REFERENCE.zip .
          sha256sum /tmp/ANIL_V1023_EXACT_SUMMARY_REFERENCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: anil-v1023-exact-summary-reference
          path: /tmp/ANIL_V1023_EXACT_SUMMARY_REFERENCE.zip
          retention-days: 7
