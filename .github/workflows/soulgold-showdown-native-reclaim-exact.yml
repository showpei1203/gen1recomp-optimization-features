name: SoulGold Showdown Exact Native Reclaim Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/showdown-animated-battlers
    paths:
      - "tools/showdown_native_reclaim_exact.py"
      - "authority/SHOWDOWN_FULL_ROM_BUDGET_BASELINE_RUN_33235195473.json"
      - ".github/workflows/soulgold-showdown-native-reclaim-exact.yml"

env:
  SOULGOLD_REV: 77ec3fc6275bb94dd703f4c1976f1457cc44a60b

jobs:
  exact-native-reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework
      - name: Checkout SoulGold v1.0.5 authority
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold
      - name: Download authoritative native symbol evidence
        uses: actions/download-artifact@v4
        with:
          name: SoulGold-Showdown-Native-Body-Budget
          path: recorded/native
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33234610234
      - name: Download authoritative 1002-species catalog
        uses: actions/download-artifact@v4
        with:
          name: SoulGold-Showdown-Full-32MiB-ROM-Budget
          path: recorded/full
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33235195473
      - name: Verify recorded evidence
        run: |
          test -s recorded/native/evidence/SHOWDOWN_NATIVE_BODY_BUDGET.json
          test -s recorded/full/evidence/SHOWDOWN_FULL_CATALOG.json
          python3 - <<'PY'
          import json
          n=json.load(open('recorded/native/evidence/SHOWDOWN_NATIVE_BODY_BUDGET.json'))
          c=json.load(open('recorded/full/evidence/SHOWDOWN_FULL_CATALOG.json'))
          assert n['rom_bytes'] == 33554432
          assert n['linked_front_back_payload_bytes'] == 1802316
          assert c['runtime_candidates_normal_front_back'] == 1002
          print('recorded evidence gate PASS')
          PY
      - name: Resolve SpeciesInfo pointers and safe reclaim
        run: |
          mkdir -p evidence
          python3 framework/tools/showdown_native_reclaim_exact.py \
            --catalog recorded/full/evidence/SHOWDOWN_FULL_CATALOG.json \
            --budget-baseline framework/authority/SHOWDOWN_FULL_ROM_BUDGET_BASELINE_RUN_33235195473.json \
            --native-budget-json recorded/native/evidence/SHOWDOWN_NATIVE_BODY_BUDGET.json \
            --soulgold soulgold \
            --output evidence/SHOWDOWN_NATIVE_RECLAIM_EXACT.json \
            | tee evidence/SHOWDOWN_NATIVE_RECLAIM_EXACT_SUMMARY.txt
      - name: Integrity gate
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('evidence/SHOWDOWN_NATIVE_RECLAIM_EXACT.json'))
          assert p['runtime_candidate_count'] == 1002
          assert p['candidate_exact_mapping_count'] >= 900, p['candidate_exact_mapping_count']
          assert p['safe_native_reclaim_bytes'] > 1000000, p['safe_native_reclaim_bytes']
          print('exact-native-reclaim integrity PASS')
          print(json.dumps(p['budgets'], indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-Showdown-Exact-Native-Reclaim
          if-no-files-found: warn
          path: |
            evidence/SHOWDOWN_NATIVE_RECLAIM_EXACT.json
            evidence/SHOWDOWN_NATIVE_RECLAIM_EXACT_SUMMARY.txt
