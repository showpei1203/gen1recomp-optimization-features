name: SoulGold PMD G4B Generated Registry Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmd-portable-battle-framework
    paths:
      - "tools/install_soulgold_g4b_generated_registry.py"
      - ".github/workflows/soulgold-pmd-g4b-generated-registry-build.yml"

env:
  SOULGOLD_REV: b5122bdf188943862c13abe4938e88b7bb3c5c4a
  SPRITECOLLAB_REV: 4b6b72aacde89abecf8d8e2f6b9e4c8a778570d7
  ROM_PATH: soulgold/Soulgold_Beta_1.gba
  UNIQUE_ROM_PATH: soulgold/SoulGold-PMD-G4B.gba

jobs:
  compile-g4b:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework
      - name: Checkout pinned SoulGold
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold
      - name: Checkout pinned SpriteCollab
        uses: actions/checkout@v4
        with:
          repository: PMDCollab/SpriteCollab
          ref: ${{ env.SPRITECOLLAB_REV }}
          path: spritecollab
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 python3-pil
      - name: Prepare G3R11 parent assets
        run: |
          python3 framework/tools/prepare_soulgold_g3r10_special_state_assets.py \
            --framework-root framework --spritecollab spritecollab \
            --soulgold soulgold --output g4b_assets
      - name: Install G4B generated registry
        run: |
          python3 framework/tools/install_soulgold_g4b_generated_registry.py \
            --framework-root framework --soulgold soulgold \
            --assets-staging g4b_assets/staging
      - name: Audit generated registry and fallback contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('soulgold/include/pmd_soulgold_species_registry.h').read_text()
          r=Path('soulgold/src/pmd_soulgold_species_registry.c').read_text()
          p=Path('soulgold/src/pmd_soulgold_prototype.c').read_text()
          s=Path('soulgold/PMD_G4B_INSTALL_STATUS.txt').read_text()
          assert 'struct PmdSpeciesProfile' in h
          assert 'PmdSoulGoldSpeciesRegistry_Find' in h
          assert r.count('.species = SPECIES_') == 2
          assert '.species = SPECIES_CYNDAQUIL' in r
          assert '.side = B_SIDE_PLAYER' in r
          assert '.species = SPECIES_MARILL' in r
          assert '.side = B_SIDE_OPPONENT' in r
          assert 'return NULL;' in r
          assert 'PmdSoulGoldSpeciesRegistry_Find(GetBattlerVisualSpecies(battler), GetBattlerSide(battler))' in p
          assert 'static const struct PmdSpeciesProfile sProfiles[]' not in p
          assert 'registry_miss_policy=RETURN_NULL_KEEP_NATIVE_SOULGOLD_BATTLER' in s
          assert 'new_species_activated=0' in s
          print('G4B registry/native fallback contract PASS')
          PY
      - name: Verify runtime ownership and OAM invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('soulgold/src/pmd_soulgold_prototype.c').read_text()
          assert 'if (profile == NULL)' in p
          m=Path('soulgold/src/battle_main.c').read_text()
          f=m[m.index('static void RunBattleSoftwareTick(void)\n{'):]
          f=f[:f.index('\n}')+2]
          assert f.index('AnimateSprites();') < f.index('PmdSoulGoldPrototype_Tick();') < f.index('BuildOamBuffer();')
          c=Path('soulgold/src/battle_move_resolution.c').read_text()
          assert c.count('PmdSoulGoldPrototype_NotifyWake(ctx->battlerAtk);') == 2
          print('G4B preserves G3R11 ownership and G3R4B OAM ordering')
          PY
      - name: Build SoulGold G4B
        working-directory: soulgold
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee PMD_G4B_BUILD.log
      - name: Audit PMD warnings or errors
        run: |
          if grep -E "src/pmd_.*(warning:|error:)" soulgold/PMD_G4B_BUILD.log; then exit 1; fi
      - name: Verify symbols and ROM
        run: |
          mkdir -p evidence
          arm-none-eabi-nm -C soulgold/Soulgold_Beta_1.elf | sort > evidence/PMD_G4B_SYMBOLS.txt
          for required in \
            PmdSoulGoldPrototype_Tick \
            PmdSoulGoldSpeciesRegistry_Find \
            PmdSoulGoldSpeciesRegistry_Count \
            PmdSoulGoldPrototype_NotifyWake; do
            grep -q "${required}$" evidence/PMD_G4B_SYMBOLS.txt || exit 1
          done
          cp "${ROM_PATH}" "${UNIQUE_ROM_PATH}"
          test "$(stat -c %s "${UNIQUE_ROM_PATH}")" -eq 33554432
      - name: Record G4B evidence
        if: always()
        run: |
          mkdir -p evidence/installed_source
          cp soulgold/PMD_G4B_INSTALL_STATUS.txt evidence/ || true
          cp soulgold/include/pmd_soulgold_species_registry.h evidence/installed_source/ || true
          cp soulgold/src/pmd_soulgold_species_registry.c evidence/installed_source/ || true
          cp soulgold/src/pmd_soulgold_prototype.c evidence/installed_source/ || true
          {
            echo "SoulGold PMD G4B Generated Species Registry evidence"
            echo "framework_commit=${GITHUB_SHA}"
            echo "soulgold_revision=${SOULGOLD_REV}"
            echo "spritecollab_revision=${SPRITECOLLAB_REV}"
            echo "runtime_parent=G3R11"
            echo "registry_entries=2"
            echo "new_species_activated=0"
            echo "registry_miss=KEEP_NATIVE_SOULGOLD_BATTLER"
            echo "next_scale_stage=G4C_GENERATED_BATCH_ASSETS"
            echo "runtime_visual_status=PENDING_USER_DEFERRED_TESTING"
            if [ -f "${UNIQUE_ROM_PATH}" ]; then
              echo "build_status=PASS"
              stat -c "rom_bytes=%s" "${UNIQUE_ROM_PATH}"
              sha256sum "${UNIQUE_ROM_PATH}"
              python3 - <<'PY'
          import os,zlib
          p=os.environ['UNIQUE_ROM_PATH']; crc=0
          with open(p,'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): crc=zlib.crc32(c,crc)
          print(f"rom_crc32={crc & 0xffffffff:08X}")
          PY
            else
              echo "build_status=FAIL_OR_NO_ROM"
            fi
          } | tee evidence/PMD_G4B_CI_EVIDENCE.txt
      - name: Upload G4B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulgold-pmd-g4b-generated-registry-evidence
          path: |
            evidence/
            soulgold/PMD_G4B_BUILD.log
      - name: Upload G4B ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-PMD-G4B-ROM
          path: soulgold/SoulGold-PMD-G4B.gba
