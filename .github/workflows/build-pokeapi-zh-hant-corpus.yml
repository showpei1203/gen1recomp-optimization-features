name: Build PokeAPI zh-Hant corpus

on:
  push:
    paths:
      - '.github/workflows/build-pokeapi-zh-hant-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PokeAPI localization CSVs
        run: |
          set -euxo pipefail
          mkdir -p /tmp/pokeapi
          base='https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv'
          for f in languages.csv pokemon_species_names.csv move_names.csv ability_names.csv item_names.csv; do
            curl --fail --location --retry 3 "$base/$f" -o "/tmp/pokeapi/$f"
          done

      - name: Build Traditional Chinese corpus
        run: |
          python - <<'PY'
          import csv, json, pathlib
          src = pathlib.Path('/tmp/pokeapi')
          out = pathlib.Path('artifact')
          out.mkdir(exist_ok=True)
          ZH = '4'
          EN = '9'

          specs = [
              ('species', 'pokemon_species_names.csv', 'pokemon_species_id', 'name'),
              ('move', 'move_names.csv', 'move_id', 'name'),
              ('ability', 'ability_names.csv', 'ability_id', 'name'),
              ('item', 'item_names.csv', 'item_id', 'name'),
          ]

          all_rows = []
          stats = {}
          for category, filename, id_col, name_col in specs:
              by_id = {}
              with (src / filename).open(encoding='utf-8', newline='') as f:
                  for r in csv.DictReader(f):
                      lang = r.get('local_language_id') or r.get('language_id')
                      if lang not in (ZH, EN):
                          continue
                      rid = int(r[id_col])
                      rec = by_id.setdefault(rid, {'id': rid, 'en': '', 'zh_hant': ''})
                      if lang == EN:
                          rec['en'] = r.get(name_col, '')
                      else:
                          rec['zh_hant'] = r.get(name_col, '')
                          if category == 'species':
                              rec['genus_zh_hant'] = r.get('genus', '')
              rows = []
              for rid in sorted(by_id):
                  rec = by_id[rid]
                  if not rec.get('en'):
                      continue
                  rec['category'] = category
                  rows.append(rec)
                  all_rows.append(rec)
              stats[category] = {
                  'english': len(rows),
                  'zh_hant_present': sum(bool(r.get('zh_hant')) for r in rows),
                  'zh_hant_missing': sum(not bool(r.get('zh_hant')) for r in rows),
              }
              fields = ['category','id','en','zh_hant'] + (['genus_zh_hant'] if category == 'species' else [])
              with (out / f'{category}_zh_hant.csv').open('w', encoding='utf-8-sig', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
                  w.writeheader(); w.writerows(rows)

          with (out / 'official_zh_hant_master.csv').open('w', encoding='utf-8-sig', newline='') as f:
              w = csv.DictWriter(f, fieldnames=['category','id','en','zh_hant','genus_zh_hant'], extrasaction='ignore')
              w.writeheader(); w.writerows(all_rows)
          (out / 'stats.json').write_text(json.dumps(stats, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SOURCE.txt').write_text(
              'Source: PokeAPI/pokeapi data/v2/csv\nLanguage: zh-hant, language id 4 (zh-TW)\nGenerated by GitHub Actions.\n',
              encoding='utf-8'
          )
          print(json.dumps(stats, ensure_ascii=False, indent=2))
          PY

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeapi-zh-hant-corpus
          path: artifact/
          if-no-files-found: error
