name: Extract Anil v1.0.23 MapInfos reference

on:
  push:
    paths:
      - '.github/workflows/extract-anil-v1023-mapinfos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/Juvenal-Yescas/mediafire-dl.git'
      - name: Download exact Anil DE 1.0.23 English
        run: |
          mkdir -p /tmp/anil
          python - <<'PY'
          import mediafire_dl
          url='https://www.mediafire.com/file/vqvq1km2qtp4yn9/Pokemon+Anil+DE+1.0.23+ENGLISH.zip/file'
          out='/tmp/anil/anil.zip'
          if not mediafire_dl.download(url,out,quiet=False):
              raise SystemExit('download failed')
          PY
      - name: Extract exact map metadata
        run: |
          mkdir -p /tmp/anil/extracted /tmp/ref/Data
          unzip -q /tmp/anil/anil.zip -d /tmp/anil/extracted
          MAPINFOS=$(find /tmp/anil/extracted -type f -path '*/Data/MapInfos.rxdata' | head -n1)
          test -n "$MAPINFOS"
          cp "$MAPINFOS" /tmp/ref/Data/MapInfos.rxdata
          sha256sum /tmp/ref/Data/MapInfos.rxdata > /tmp/ref/MAPINFOS_SHA256.txt
          ls -lh /tmp/ref/Data/MapInfos.rxdata
      - name: Package reference
        run: |
          cd /tmp/ref
          zip -qr /tmp/ANIL_V1023_MAPINFOS_REFERENCE.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: anil-v1023-mapinfos-reference
          path: /tmp/ANIL_V1023_MAPINFOS_REFERENCE.zip
          retention-days: 7
