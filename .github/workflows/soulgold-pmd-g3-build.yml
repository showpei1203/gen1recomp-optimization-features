name: SoulGold PMD G3 Build Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmd-portable-battle-framework
    paths:
      - "prototype/soulgold_g3/**"
      - "tools/convert_soulgold_g3.py"
      - "tools/emit_soulgold_g3_c.py"
      - "tools/prepare_soulgold_g3_assets.py"
      - "tools/install_soulgold_g3.py"
      - ".github/workflows/soulgold-pmd-g3-build.yml"

env:
  SOULGOLD_REV: b5122bdf188943862c13abe4938e88b7bb3c5c4a
  SPRITECOLLAB_REV: 4b6b72aacde89abecf8d8e2f6b9e4c8a778570d7
  ROM_PATH: soulgold/Soulgold_Beta_1.gba

jobs:
  compile-g3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework

      - name: Checkout pinned SoulGold
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold

      - name: Checkout pinned SpriteCollab
        uses: actions/checkout@v4
        with:
          repository: PMDCollab/SpriteCollab
          ref: ${{ env.SPRITECOLLAB_REV }}
          path: spritecollab

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3 \
            python3-pil

      - name: Prepare G3 directional and PMD-shadow Cyndaquil assets
        run: |
          python3 framework/tools/prepare_soulgold_g3_assets.py \
            --framework-root framework \
            --spritecollab spritecollab \
            --soulgold soulgold \
            --output g3_assets

      - name: Install G3 candidate
        run: |
          python3 framework/tools/install_soulgold_g3.py \
            --framework-root framework \
            --soulgold soulgold \
            --assets-staging g3_assets/staging

      - name: Verify G3 scope invariants
        run: |
          grep -q "PmdSoulGoldPrototype_Init" soulgold/src/battle_main.c
          grep -q "PmdSoulGoldPrototype_Tick" soulgold/src/battle_main.c
          grep -q "PmdSoulGoldPrototype_PrimeBattlerBody" soulgold/src/battle_controllers.c
          grep -q "PmdSoulGold_PrimeBodyFrame" soulgold/src/pmd_soulgold_adapter.c
          grep -q "RotateAction" soulgold/src/pmd_soulgold_prototype.c
          grep -q "PoseAction" soulgold/src/pmd_soulgold_prototype.c
          for banned in LookUp DeepBreath Sit; do
            ! grep -q "${banned}Action" soulgold/src/pmd_soulgold_prototype.c || {
              echo "G3 must not schedule non-directional ${banned} in battle ambient" >&2
              exit 1
            }
          done
          test -f soulgold/src/pmd_cyndaquil_player_ambient.c
          test -f soulgold/src/pmd_cyndaquil_opponent_ambient.c
          for action in idle walk nod pose rotate; do
            test -d "soulgold/graphics/pmd/cyndaquil/player/${action}"
            test -d "soulgold/graphics/pmd/cyndaquil/opponent/${action}"
          done
          for banned in lookup deepbreath sit; do
            test ! -d "soulgold/graphics/pmd/cyndaquil/player/${banned}"
            test ! -d "soulgold/graphics/pmd/cyndaquil/opponent/${banned}"
          done
          python3 - <<'PY'
          import json
          for side in ("player", "opponent"):
              p = f"soulgold/graphics/pmd/cyndaquil/{side}/manifest.ir.json"
              d = json.load(open(p, encoding="utf-8"))
              s = d.get("shadow", {})
              assert s.get("shadow_size") == 1, (side, s)
              assert s.get("body_shadow_frame_sync") == "atomic_same_frame", (side, s)
          print("PMD shadow metadata PASS")
          PY
          test -z "$(git -C soulgold diff -- src/data.c)" || {
            echo "G3 must not modify src/data.c / MAX_MON_PIC_FRAMES plumbing" >&2
            exit 1
          }
          ! grep -R "sprite->anims = gAnims_MonPic" -n soulgold/src/pmd_* || {
            echo "G3 must not replace native battler anim tables" >&2
            exit 1
          }
          test -z "$(git -C soulgold diff -- src/save.c src/save_failed_screen.c include/save.h)" || {
            echo "G3 must not change save format plumbing" >&2
            exit 1
          }

      - name: Build SoulGold G3
        working-directory: soulgold
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee PMD_G3_BUILD.log

      - name: Audit PMD sources for warnings or errors
        run: |
          if grep -E "src/pmd_.*(warning:|error:)" soulgold/PMD_G3_BUILD.log; then
            echo "PMD G3 source warning/error detected" >&2
            exit 1
          fi

      - name: Record build evidence
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "SoulGold PMD G3 CI evidence"
            echo "soulgold_revision=${SOULGOLD_REV}"
            echo "spritecollab_revision=${SPRITECOLLAB_REV}"
            echo "framework_commit=${GITHUB_SHA}"
            echo "gate=Cyndaquil 45-degree-HOME-compatible ambient + PMD sendout body prime + authentic per-frame PMD shadow"
            echo "ambient=HOME+Idle+Walk+Nod+Pose+Rotate"
            echo "banned_ambient=LookUp,DeepBreath,Sit"
            echo "shadow=PMD Shadow.png / ShadowSize=1 / body-shadow atomic frame sync"
            echo "sendout_motion_owner=SOULGOLD_NATIVE"
            echo "g1_renderer_contract=SEALED_REUSED"
            echo "save_structure=UNCHANGED"
            echo "runtime_visual_status=PENDING"
            if [ -f "${ROM_PATH}" ]; then
              echo "build_status=PASS"
              stat -c "rom_bytes=%s" "${ROM_PATH}"
              sha256sum "${ROM_PATH}"
              python3 - <<'PY'
          import os, zlib
          p = os.environ["ROM_PATH"]
          crc = 0
          with open(p, "rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                  crc = zlib.crc32(chunk, crc)
          print(f"rom_crc32={crc & 0xffffffff:08X}")
          PY
            else
              echo "build_status=FAIL_OR_NO_ROM"
            fi
          } | tee evidence/PMD_G3_CI_EVIDENCE.txt

      - name: Upload logs and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulgold-pmd-g3-build-evidence
          if-no-files-found: warn
          path: |
            evidence/PMD_G3_CI_EVIDENCE.txt
            g3_assets/G3_ASSET_SUMMARY.json
            soulgold/PMD_G3_INSTALL_STATUS.txt
            soulgold/PMD_G3_BUILD.log

      - name: Upload test ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-PMD-G3-Facing-Sendout-Shadow-Test-ROM
          if-no-files-found: error
          path: soulgold/Soulgold_Beta_1.gba
