name: SoulGold PMD G3R3 Build Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmd-portable-battle-framework
    paths:
      - "prototype/soulgold_g3/**"
      - "tools/convert_soulgold_g3.py"
      - "tools/emit_soulgold_g3_c.py"
      - "tools/prepare_soulgold_g3_assets.py"
      - "tools/install_soulgold_g3.py"
      - ".github/workflows/soulgold-pmd-g3-build.yml"

env:
  SOULGOLD_REV: b5122bdf188943862c13abe4938e88b7bb3c5c4a
  SPRITECOLLAB_REV: 4b6b72aacde89abecf8d8e2f6b9e4c8a778570d7
  ROM_PATH: soulgold/Soulgold_Beta_1.gba
  UNIQUE_ROM_PATH: soulgold/SoulGold-PMD-G3R3.gba

jobs:
  compile-g3r3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework

      - name: Checkout pinned SoulGold
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold

      - name: Checkout pinned SpriteCollab
        uses: actions/checkout@v4
        with:
          repository: PMDCollab/SpriteCollab
          ref: ${{ env.SPRITECOLLAB_REV }}
          path: spritecollab

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3 \
            python3-pil

      - name: Prepare G3R3 two-sided grounded PMD assets
        run: |
          python3 framework/tools/prepare_soulgold_g3_assets.py \
            --framework-root framework \
            --spritecollab spritecollab \
            --soulgold soulgold \
            --output g3_assets

      - name: Install G3R3 candidate
        run: |
          python3 framework/tools/install_soulgold_g3.py \
            --framework-root framework \
            --soulgold soulgold \
            --assets-staging g3_assets/staging

      - name: Verify G3R3 pre-link invariants
        run: |
          grep -q "PmdSoulGoldPrototype_Init" soulgold/src/battle_main.c
          grep -q "PmdSoulGoldPrototype_Tick" soulgold/src/battle_main.c
          grep -q "PmdSoulGoldPrototype_PrimeLoadedBattlerBody" soulgold/src/battle_gfx_sfx_util.c
          grep -q "PmdSoulGoldPrototype_PrimeTemplateBody" soulgold/src/battle_controllers.c
          grep -q "PmdSoulGold_PrimeLoadedBody" soulgold/src/pmd_soulgold_adapter.c
          grep -q "PmdSoulGold_PrimeTemplateBody" soulgold/src/pmd_soulgold_adapter.c
          grep -q "SPECIES_CYNDAQUIL" soulgold/src/pmd_soulgold_prototype.c
          grep -q "SPECIES_MARILL" soulgold/src/pmd_soulgold_prototype.c
          grep -q "gPmdCyndaquilPlayerRotateAction" soulgold/src/pmd_soulgold_prototype.c
          grep -q "gPmdMarillOpponentRotateAction" soulgold/src/pmd_soulgold_prototype.c
          ! grep -q "PoseAction" soulgold/src/pmd_soulgold_prototype.c
          test -f soulgold/src/pmd_cyndaquil_player_ambient.c
          test -f soulgold/src/pmd_marill_opponent_ambient.c
          for action in idle walk nod rotate; do
            test -d "soulgold/graphics/pmd/cyndaquil/player/${action}"
            test -d "soulgold/graphics/pmd/marill/opponent/${action}"
          done
          test ! -d soulgold/graphics/pmd/cyndaquil/player/pose
          test ! -d soulgold/graphics/pmd/marill/opponent/pose
          python3 - <<'PY'
          import json
          summary = json.load(open("g3_assets/G3_ASSET_SUMMARY.json", encoding="utf-8"))
          assert summary["phase"] == "G3R3_TWO_SIDED_GROUNDED"
          assert summary["ground_anchor"] == "PMD Shadow.png white origin"
          assert summary["runtime_offset_policy"].endswith("presentationX=0 presentationY=0")
          expected = {
              "Cyndaquil_player": ("Cyndaquil", "player", "UpRight"),
              "Marill_opponent": ("Marill", "opponent", "DownLeft"),
          }
          for key, values in expected.items():
              rec = summary["targets"][key]
              assert (rec["species"], rec["variant"], rec["direction"]) == values
              s = rec["manifest_shadow"]
              assert s["ground_anchor"] == "PMD white shadow-origin marker"
              assert s["body_shadow_frame_sync"] == "atomic_same_frame"
              for action, frames in rec["shadow_source_audit"]["actions"].items():
                  assert frames
                  for frame in frames:
                      assert len(frame["shadow_origin"]) == 2
                      assert frame["active_shadow_pixels"] > 0
          print("G3R3 two-sided PMD shadow-origin metadata gate PASS")
          PY
          test -z "$(git -C soulgold diff -- src/data.c)" || {
            echo "G3R3 must not modify src/data.c / MAX_MON_PIC_FRAMES plumbing" >&2
            exit 1
          }
          ! grep -R "sprite->anims = gAnims_MonPic" -n soulgold/src/pmd_* || {
            echo "G3R3 must not replace native battler anim tables" >&2
            exit 1
          }
          ! grep -R "PmdSoulGold_PrimeBodyFrame" -n soulgold/src/pmd_* || {
            echo "Legacy cross-owner prime helper must not survive G3R3" >&2
            exit 1
          }
          test -z "$(git -C soulgold diff -- src/save.c src/save_failed_screen.c include/save.h)" || {
            echo "G3R3 must not change save format plumbing" >&2
            exit 1
          }

      - name: Build SoulGold G3R3
        working-directory: soulgold
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee PMD_G3R3_BUILD.log

      - name: Audit PMD sources for warnings or errors
        run: |
          if grep -E "src/pmd_.*(warning:|error:)" soulgold/PMD_G3R3_BUILD.log; then
            echo "PMD G3R3 source warning/error detected" >&2
            exit 1
          fi

      - name: Verify final ELF contains G3R3 symbols
        run: |
          mkdir -p evidence
          arm-none-eabi-nm -C soulgold/Soulgold_Beta_1.elf | sort > evidence/PMD_G3R3_SYMBOLS.txt
          for required in \
            gPmdCyndaquilPlayerHomeAction \
            gPmdCyndaquilPlayerIdleAction \
            gPmdCyndaquilPlayerWalkAction \
            gPmdCyndaquilPlayerNodAction \
            gPmdCyndaquilPlayerRotateAction \
            gPmdMarillOpponentHomeAction \
            gPmdMarillOpponentIdleAction \
            gPmdMarillOpponentWalkAction \
            gPmdMarillOpponentNodAction \
            gPmdMarillOpponentRotateAction \
            PmdSoulGoldPrototype_PrimeLoadedBattlerBody \
            PmdSoulGoldPrototype_PrimeTemplateBody \
            PmdSoulGold_PrimeLoadedBody \
            PmdSoulGold_PrimeTemplateBody; do
            grep -q "${required}$" evidence/PMD_G3R3_SYMBOLS.txt || {
              echo "Missing required linked G3R3 symbol: ${required}" >&2
              exit 1
            }
          done
          ! grep -q "gPmd.*PoseAction$" evidence/PMD_G3R3_SYMBOLS.txt
          cp "${ROM_PATH}" "${UNIQUE_ROM_PATH}"

      - name: Record build evidence
        if: always()
        run: |
          mkdir -p evidence/installed_source
          cp soulgold/src/pmd_gba_runtime.c evidence/installed_source/
          cp soulgold/src/pmd_soulgold_adapter.c evidence/installed_source/
          cp soulgold/src/pmd_soulgold_prototype.c evidence/installed_source/
          cp soulgold/src/pmd_cyndaquil_player_ambient.c evidence/installed_source/
          cp soulgold/src/pmd_marill_opponent_ambient.c evidence/installed_source/
          git -C soulgold diff -- src/battle_main.c src/battle_gfx_sfx_util.c src/battle_controllers.c > evidence/SOULGOLD_G3R3_HOST_PATCH.diff
          {
            echo "SoulGold PMD G3R3 CI evidence"
            echo "soulgold_revision=${SOULGOLD_REV}"
            echo "spritecollab_revision=${SPRITECOLLAB_REV}"
            echo "framework_commit=${GITHUB_SHA}"
            echo "gate=player Cyndaquil PMD vs opponent Marill PMD"
            echo "ambient=HOME+Idle+Walk+Nod+Rotate"
            echo "ground_anchor=PMD Shadow.png white origin"
            echo "runtime_offsets=0,0 for grounded frames"
            echo "ownership=species+side registry; loaded/template prime separated"
            echo "native_sprite_anims=UNCHANGED"
            echo "MAX_MON_PIC_FRAMES=UNCHANGED"
            echo "save_structure=UNCHANGED"
            echo "runtime_visual_status=PENDING_USER_ACCEPTANCE"
            if [ -f "${UNIQUE_ROM_PATH}" ]; then
              echo "build_status=PASS"
              stat -c "rom_bytes=%s" "${UNIQUE_ROM_PATH}"
              sha256sum "${UNIQUE_ROM_PATH}"
            else
              echo "build_status=FAIL_OR_NO_ROM"
            fi
          } | tee evidence/PMD_G3R3_CI_EVIDENCE.txt

      - name: Upload logs sources map and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulgold-pmd-g3r3-build-evidence
          if-no-files-found: warn
          path: |
            evidence/
            g3_assets/G3_ASSET_SUMMARY.json
            soulgold/PMD_G3_INSTALL_STATUS.txt
            soulgold/PMD_G3R3_BUILD.log
            soulgold/Soulgold_Beta_1.map

      - name: Upload uniquely named G3R3 test ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-PMD-G3R3-Cyndaquil-vs-Marill-Test-ROM
          if-no-files-found: error
          path: soulgold/SoulGold-PMD-G3R3.gba
