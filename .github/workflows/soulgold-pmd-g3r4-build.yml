name: SoulGold PMD G3R4 Regression Recovery Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmd-portable-battle-framework
    paths:
      - "prototype/soulgold_g3r4/**"
      - "tools/convert_soulgold_g3r4.py"
      - "tools/prepare_soulgold_g3r4_assets.py"
      - "tools/install_soulgold_g3r4.py"
      - "tools/emit_soulgold_g3_c.py"
      - ".github/workflows/soulgold-pmd-g3r4-build.yml"

env:
  SOULGOLD_REV: b5122bdf188943862c13abe4938e88b7bb3c5c4a
  SPRITECOLLAB_REV: 4b6b72aacde89abecf8d8e2f6b9e4c8a778570d7
  ROM_PATH: soulgold/Soulgold_Beta_1.gba
  UNIQUE_ROM_PATH: soulgold/SoulGold-PMD-G3R4.gba

jobs:
  compile-g3r4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework

      - name: Checkout pinned SoulGold
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold

      - name: Checkout pinned SpriteCollab
        uses: actions/checkout@v4
        with:
          repository: PMDCollab/SpriteCollab
          ref: ${{ env.SPRITECOLLAB_REV }}
          path: spritecollab

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 python3-pil

      - name: Prepare G3R4 body-only two-sided assets
        run: |
          python3 framework/tools/prepare_soulgold_g3r4_assets.py \
            --framework-root framework \
            --spritecollab spritecollab \
            --soulgold soulgold \
            --output g3r4_assets

      - name: Install G3R4 candidate
        run: |
          python3 framework/tools/install_soulgold_g3r4.py \
            --framework-root framework \
            --soulgold soulgold \
            --assets-staging g3r4_assets/staging

      - name: Verify G3R4 regression-recovery invariants
        run: |
          grep -q "PmdSoulGoldPrototype_Init" soulgold/src/battle_main.c
          grep -q "PmdSoulGoldPrototype_Tick" soulgold/src/battle_main.c
          grep -q "PmdSoulGoldPrototype_PrimeLoadedBattlerBody" soulgold/src/battle_gfx_sfx_util.c
          test "$(grep -c 'PmdSoulGoldPrototype_PrimeTemplateBody(battler, species);' soulgold/src/battle_controllers.c)" -eq 2
          test "$(grep -c 'PmdSoulGoldPrototype_PrimeCreatedSpriteBody(battler, species);' soulgold/src/battle_controllers.c)" -eq 2
          grep -q "created_sprite_vram_prime_paths=2" soulgold/PMD_G3R4_INSTALL_STATUS.txt
          grep -q "RequestSpriteFrameImageCopy(0, sprite->oam.tileNum, sprite->images);" soulgold/src/pmd_soulgold_adapter.c
          ! grep -q "SpriteCallbackDummy" soulgold/src/pmd_soulgold_adapter.c
          grep -q "SPECIES_CYNDAQUIL" soulgold/src/pmd_soulgold_prototype.c
          grep -q "SPECIES_MARILL" soulgold/src/pmd_soulgold_prototype.c
          ! grep -q "PoseAction" soulgold/src/pmd_soulgold_prototype.c
          python3 - <<'PY'
          import json
          summary = json.load(open("g3r4_assets/G3R4_ASSET_SUMMARY.json", encoding="utf-8"))
          assert summary["phase"] == "G3R4_REGRESSION_RECOVERY"
          assert summary["body_anchor_policy"] == "PMD_BODY_CENTER_PER_FRAME_G2_RESTORED"
          assert summary["shadow_policy"].startswith("NOT_INCLUDED_IN_BODY")
          expected = {
              "Cyndaquil_player": ("Cyndaquil", "player", "UpRight"),
              "Marill_opponent": ("Marill", "opponent", "DownLeft"),
          }
          for key, values in expected.items():
              rec = summary["targets"][key]
              assert (rec["species"], rec["variant"], rec["direction"]) == values
              slug = rec["species"].lower()
              manifest = json.load(open(f"soulgold/graphics/pmd/{slug}/{rec['variant']}/manifest.ir.json", encoding="utf-8"))
              assert manifest["grounding"]["body_anchor_policy"] == "PMD_BODY_CENTER_PER_FRAME_G2_RESTORED"
              assert manifest["shadow"]["included_in_body_frames"] is False
              assert manifest["shadow"]["policy"] == "SEPARATE_GROUND_LAYER_REQUIRED_AFTER_BODY_RECOVERY"
              anchor = manifest["body_profile"]["anchor_target"]
              for action in ("Idle", "Walk", "Nod", "Rotate"):
                  frames = manifest["actions"][action]["frames"]
                  assert frames
                  for f in frames:
                      assert f["source_center_x"] + f["paste_x"] == anchor["x"]
                      assert f["source_center_y"] + f["paste_y"] == anchor["y"]
                      assert (f["presentation_dx"], f["presentation_dy"]) == (0, 0)
          print("G3R4 body-center + separate-shadow + two-sided metadata PASS")
          PY
          test -z "$(git -C soulgold diff -- src/data.c)" || exit 1
          ! grep -R "sprite->anims = gAnims_MonPic" -n soulgold/src/pmd_* || exit 1
          test -z "$(git -C soulgold diff -- src/save.c src/save_failed_screen.c include/save.h)" || exit 1

      - name: Build SoulGold G3R4
        working-directory: soulgold
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee PMD_G3R4_BUILD.log

      - name: Audit PMD sources for warnings or errors
        run: |
          if grep -E "src/pmd_.*(warning:|error:)" soulgold/PMD_G3R4_BUILD.log; then
            echo "PMD G3R4 source warning/error detected" >&2
            exit 1
          fi

      - name: Verify final ELF contains G3R4 symbols
        run: |
          mkdir -p evidence
          arm-none-eabi-nm -C soulgold/Soulgold_Beta_1.elf | sort > evidence/PMD_G3R4_SYMBOLS.txt
          for required in \
            gPmdCyndaquilPlayerHomeAction gPmdCyndaquilPlayerIdleAction gPmdCyndaquilPlayerWalkAction \
            gPmdCyndaquilPlayerNodAction gPmdCyndaquilPlayerRotateAction \
            gPmdMarillOpponentHomeAction gPmdMarillOpponentIdleAction gPmdMarillOpponentWalkAction \
            gPmdMarillOpponentNodAction gPmdMarillOpponentRotateAction \
            PmdSoulGoldPrototype_PrimeLoadedBattlerBody PmdSoulGoldPrototype_PrimeTemplateBody \
            PmdSoulGoldPrototype_PrimeCreatedSpriteBody PmdSoulGold_PrimeCreatedSpriteBody; do
            grep -q "${required}$" evidence/PMD_G3R4_SYMBOLS.txt || {
              echo "Missing required G3R4 symbol: ${required}" >&2
              exit 1
            }
          done
          cp "${ROM_PATH}" "${UNIQUE_ROM_PATH}"

      - name: Record build evidence
        if: always()
        run: |
          mkdir -p evidence/installed_source
          cp soulgold/src/pmd_gba_runtime.c evidence/installed_source/ || true
          cp soulgold/src/pmd_soulgold_adapter.c evidence/installed_source/ || true
          cp soulgold/src/pmd_soulgold_prototype.c evidence/installed_source/ || true
          cp soulgold/src/pmd_cyndaquil_player_ambient.c evidence/installed_source/ || true
          cp soulgold/src/pmd_marill_opponent_ambient.c evidence/installed_source/ || true
          git -C soulgold diff -- src/battle_main.c src/battle_gfx_sfx_util.c src/battle_controllers.c > evidence/SOULGOLD_G3R4_HOST_PATCH.diff
          {
            echo "SoulGold PMD G3R4 regression-recovery CI evidence"
            echo "soulgold_revision=${SOULGOLD_REV}"
            echo "spritecollab_revision=${SPRITECOLLAB_REV}"
            echo "framework_commit=${GITHUB_SHA}"
            echo "gate=restore G2 body geometry + post-create OBJ VRAM prime + opponent ownership"
            echo "player=Cyndaquil UpRight"
            echo "opponent=Marill DownLeft"
            echo "ambient=HOME+Idle+Walk+Nod+Rotate"
            echo "body_anchor=PMD green body center per frame (G2 restored)"
            echo "shadow_in_body=FALSE"
            echo "created_sprite_vram_prime_paths=2"
            echo "opponent_callback_whitelist=REMOVED"
            echo "MAX_MON_PIC_FRAMES=UNCHANGED"
            echo "save_structure=UNCHANGED"
            echo "runtime_visual_status=PENDING_USER_ACCEPTANCE"
            if [ -f "${UNIQUE_ROM_PATH}" ]; then
              echo "build_status=PASS"
              stat -c "rom_bytes=%s" "${UNIQUE_ROM_PATH}"
              sha256sum "${UNIQUE_ROM_PATH}"
              python3 - <<'PY'
          import os, zlib
          p = os.environ["UNIQUE_ROM_PATH"]
          crc = 0
          with open(p, "rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                  crc = zlib.crc32(chunk, crc)
          print(f"rom_crc32={crc & 0xffffffff:08X}")
          PY
            else
              echo "build_status=FAIL_OR_NO_ROM"
            fi
          } | tee evidence/PMD_G3R4_CI_EVIDENCE.txt

      - name: Upload G3R4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulgold-pmd-g3r4-build-evidence
          if-no-files-found: warn
          path: |
            evidence/
            g3r4_assets/G3R4_ASSET_SUMMARY.json
            soulgold/PMD_G3R4_INSTALL_STATUS.txt
            soulgold/PMD_G3R4_BUILD.log
            soulgold/Soulgold_Beta_1.map

      - name: Upload G3R4 test ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-PMD-G3R4-Regression-Recovery-ROM
          if-no-files-found: error
          path: soulgold/SoulGold-PMD-G3R4.gba
