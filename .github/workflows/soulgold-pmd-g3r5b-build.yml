name: SoulGold PMD G3R5B Residual Grounding Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmd-portable-battle-framework
    paths:
      - "tools/convert_soulgold_g3r5b.py"
      - "tools/emit_soulgold_g3r5b_c.py"
      - "tools/prepare_soulgold_g3r5b_assets.py"
      - "tools/install_soulgold_g3r5b.py"
      - ".github/workflows/soulgold-pmd-g3r5b-build.yml"

env:
  SOULGOLD_REV: b5122bdf188943862c13abe4938e88b7bb3c5c4a
  SPRITECOLLAB_REV: 4b6b72aacde89abecf8d8e2f6b9e4c8a778570d7
  ROM_PATH: soulgold/Soulgold_Beta_1.gba
  UNIQUE_ROM_PATH: soulgold/SoulGold-PMD-G3R5B.gba

jobs:
  compile-g3r5b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework

      - name: Checkout pinned SoulGold
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold

      - name: Checkout pinned SpriteCollab
        uses: actions/checkout@v4
        with:
          repository: PMDCollab/SpriteCollab
          ref: ${{ env.SPRITECOLLAB_REV }}
          path: spritecollab

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 python3-pil

      - name: Prepare G3R5B assets
        run: |
          python3 framework/tools/prepare_soulgold_g3r5b_assets.py \
            --framework-root framework \
            --spritecollab spritecollab \
            --soulgold soulgold \
            --output g3r5b_assets

      - name: Audit G3R5B runtime fixes
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('g3r5b_assets/G3R5B_ASSET_SUMMARY.json',encoding='utf-8'))
          assert s['phase']=='G3R5B_BODY_SUPPORT_CENTERED_PMD_SHADOW'
          assert s['shadow_png_may_move_body'] is False
          cy=s['targets']['Cyndaquil_player']
          assert cy['idle_corrections'][0] == 0
          assert cy['idle_corrections'][1] < 0, cy['idle_corrections']
          assert cy['battle_shadow_x_offset'] == 0
          print('Cyndaquil Idle corrections:', cy['idle_corrections'])
          print('Cyndaquil shadow authored X -> battle X:', cy['pmd_authored_idle0_shadow_x_offset'], '->', cy['battle_shadow_x_offset'])
          ma=s['targets']['Marill_opponent']
          print('Marill Idle corrections:', ma['idle_corrections'])
          PY

      - name: Install G3R5B candidate
        run: |
          python3 framework/tools/install_soulgold_g3r5b.py \
            --framework-root framework \
            --soulgold soulgold \
            --assets-staging g3r5b_assets/staging

      - name: Verify timing and ownership invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('soulgold/src/battle_main.c').read_text()
          start=text.index('static void RunBattleSoftwareTick(void)\n{')
          end=text.index('\n}',start)
          fn=text[start:end]
          assert fn.index('AnimateSprites();') < fn.index('PmdSoulGoldPrototype_Tick();') < fn.index('BuildOamBuffer();') < fn.index('RunTasks();')
          assert fn.count('PmdSoulGoldPrototype_Tick();')==1
          PY
          grep -q "shadow_png_may_move_body=FALSE" soulgold/PMD_G3R5B_INSTALL_STATUS.txt
          grep -q "GroundShadowXOffset = 0;" soulgold/src/pmd_cyndaquil_player_shadow.c
          grep -q "SpriteCollab sprite/0155/Idle-Shadow.png" soulgold/src/pmd_cyndaquil_player_shadow.c
          grep -q "SpriteCollab sprite/0183/Idle-Shadow.png" soulgold/src/pmd_marill_opponent_shadow.c
          grep -q "SetBattlerShadowSpriteCallback" soulgold/src/pmd_soulgold_adapter.c
          test -z "$(git -C soulgold diff -- src/save.c src/save_failed_screen.c include/save.h)"

      - name: Build SoulGold G3R5B
        working-directory: soulgold
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee PMD_G3R5B_BUILD.log

      - name: Audit PMD warnings or errors
        run: |
          if grep -E "src/pmd_.*(warning:|error:)" soulgold/PMD_G3R5B_BUILD.log; then exit 1; fi

      - name: Verify ELF and ROM
        run: |
          mkdir -p evidence
          arm-none-eabi-nm -C soulgold/Soulgold_Beta_1.elf | sort > evidence/PMD_G3R5B_SYMBOLS.txt
          for required in PmdSoulGoldPrototype_Tick PmdSoulGold_UpdateGroundShadow \
            gPmdCyndaquilPlayerIdleAction gPmdCyndaquilPlayerGroundShadowGfx \
            gPmdMarillOpponentIdleAction gPmdMarillOpponentGroundShadowGfx; do
            grep -q "${required}$" evidence/PMD_G3R5B_SYMBOLS.txt || exit 1
          done
          cp "${ROM_PATH}" "${UNIQUE_ROM_PATH}"

      - name: Record evidence
        if: always()
        run: |
          mkdir -p evidence/installed_source
          cp g3r5b_assets/G3R5B_ASSET_SUMMARY.json evidence/ || true
          cp soulgold/PMD_G3R5B_INSTALL_STATUS.txt evidence/ || true
          cp soulgold/src/pmd_cyndaquil_player_ambient.c evidence/installed_source/ || true
          cp soulgold/src/pmd_cyndaquil_player_shadow.c evidence/installed_source/ || true
          cp soulgold/src/pmd_marill_opponent_ambient.c evidence/installed_source/ || true
          cp soulgold/src/pmd_marill_opponent_shadow.c evidence/installed_source/ || true
          cp soulgold/src/pmd_soulgold_adapter.c evidence/installed_source/ || true
          {
            echo "SoulGold PMD G3R5B residual grounding evidence"
            echo "framework_commit=${GITHUB_SHA}"
            echo "parent=G3R5"
            echo "body_grounding=ROBUST_BODY_SUPPORT_BASELINE"
            echo "shadow_png_may_move_body=FALSE"
            echo "player_shadow_x=CENTERED_ON_BATTLER_BASE_X"
            echo "g3r4b_oam_timing=PRESERVED"
            echo "runtime_visual_status=PENDING_USER_ACCEPTANCE"
            if [ -f "${UNIQUE_ROM_PATH}" ]; then
              echo "build_status=PASS"
              stat -c "rom_bytes=%s" "${UNIQUE_ROM_PATH}"
              sha256sum "${UNIQUE_ROM_PATH}"
              python3 - <<'PY'
          import os,zlib
          p=os.environ['UNIQUE_ROM_PATH']; crc=0
          with open(p,'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): crc=zlib.crc32(c,crc)
          print(f"rom_crc32={crc & 0xffffffff:08X}")
          PY
            else
              echo "build_status=FAIL_OR_NO_ROM"
            fi
          } | tee evidence/PMD_G3R5B_CI_EVIDENCE.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulgold-pmd-g3r5b-build-evidence
          path: |
            evidence/
            soulgold/PMD_G3R5B_BUILD.log

      - name: Upload test ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-PMD-G3R5B-ROM
          path: soulgold/SoulGold-PMD-G3R5B.gba
