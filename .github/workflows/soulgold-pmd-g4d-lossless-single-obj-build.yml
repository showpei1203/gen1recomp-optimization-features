name: SoulGold PMD G4D Lossless Single OBJ Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmd-portable-battle-framework
    paths:
      - "tools/audit_soulgold_g4d_lossless_single_obj.py"
      - ".github/workflows/soulgold-pmd-g4d-lossless-single-obj-build.yml"

env:
  SOULGOLD_REV: b5122bdf188943862c13abe4938e88b7bb3c5c4a
  SPRITECOLLAB_REV: 4b6b72aacde89abecf8d8e2f6b9e4c8a778570d7
  ROM_PATH: soulgold/Soulgold_Beta_1.gba
  UNIQUE_ROM_PATH: soulgold/SoulGold-PMD-G4D.gba

jobs:
  compile-g4d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework
      - name: Checkout pinned SoulGold
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold
      - name: Checkout pinned SpriteCollab
        uses: actions/checkout@v4
        with:
          repository: PMDCollab/SpriteCollab
          ref: ${{ env.SPRITECOLLAB_REV }}
          path: spritecollab
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 python3-pil
      - name: Prepare G3R11 parent assets
        run: |
          python3 framework/tools/prepare_soulgold_g3r10_special_state_assets.py \
            --framework-root framework --spritecollab spritecollab \
            --soulgold soulgold --output g4d_assets
      - name: Install G4B generated registry parent
        run: |
          python3 framework/tools/install_soulgold_g4b_generated_registry.py \
            --framework-root framework --soulgold soulgold \
            --assets-staging g4d_assets/staging
      - name: Audit lossless visible-pixel single-OBJ eligibility
        run: |
          mkdir -p evidence
          python3 framework/tools/audit_soulgold_g4d_lossless_single_obj.py \
            --soulgold soulgold --spritecollab spritecollab \
            --output evidence/G4D_LOSSLESS_SINGLE_OBJ_AUDIT.json | tee evidence/G4D_LOSSLESS_SINGLE_OBJ_AUDIT.txt
          python3 - <<'PY'
          import json
          p=json.load(open('evidence/G4D_LOSSLESS_SINGLE_OBJ_AUDIT.json'))
          c=p['counts']
          assert p['national_dex_count'] >= 251
          assert sum(c.values()) == p['national_dex_count']
          assert p['transparent_source_overflow']=='ALLOWED'
          assert p['opaque_source_overflow']=='FORBIDDEN_FOR_SINGLE_OBJ'
          assert p['fallback']=='MISSING_OR_INVALID_PMD_REMAINS_NATIVE_SOULGOLD'
          assert c['LOSSLESS_SINGLE_OBJ_BOTH_SIDES'] > 0
          print('G4D lossless visible-pixel source gate PASS')
          PY
      - name: Compare conservative G4A geometry screen
        run: |
          python3 framework/tools/audit_soulgold_g4a_pmd_roster_coverage.py \
            --soulgold soulgold --spritecollab spritecollab \
            --output evidence/G4D_G4A_CONSERVATIVE_COMPARE.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('evidence/G4D_G4A_CONSERVATIVE_COMPARE.json'))
          d=json.load(open('evidence/G4D_LOSSLESS_SINGLE_OBJ_AUDIT.json'))
          print('G4A source-dimension single OBJ:', a['counts']['FULL_PMD_SINGLE_OBJ'])
          print('G4D opaque-pixel lossless single OBJ:', d['counts']['LOSSLESS_SINGLE_OBJ_BOTH_SIDES'])
          print('G4D source-complete core:', d['source_complete_core_count'])
          PY
      - name: Verify native fallback registry remains unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('soulgold/src/pmd_soulgold_species_registry.c').read_text()
          p=Path('soulgold/src/pmd_soulgold_prototype.c').read_text()
          assert r.count('.species = SPECIES_') == 2
          assert 'return NULL;' in r
          assert 'PmdSoulGoldSpeciesRegistry_Find(GetBattlerVisualSpecies(battler), GetBattlerSide(battler))' in p
          print('G4D audit does not activate unproven species; native fallback preserved')
          PY
      - name: Build SoulGold G4D
        working-directory: soulgold
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee PMD_G4D_BUILD.log
      - name: Audit PMD warnings or errors
        run: |
          if grep -E "src/pmd_.*(warning:|error:)" soulgold/PMD_G4D_BUILD.log; then exit 1; fi
      - name: Verify ROM
        run: |
          cp "${ROM_PATH}" "${UNIQUE_ROM_PATH}"
          test "$(stat -c %s "${UNIQUE_ROM_PATH}")" -eq 33554432
      - name: Record G4D evidence
        if: always()
        run: |
          {
            echo "SoulGold PMD G4D Lossless Single OBJ evidence"
            echo "framework_commit=${GITHUB_SHA}"
            echo "soulgold_revision=${SOULGOLD_REV}"
            echo "spritecollab_revision=${SPRITECOLLAB_REV}"
            echo "runtime_parent=G4B_G3R11"
            echo "activation_change=NONE_AUDIT_ONLY"
            echo "single_obj_rule=OPAQUE_PIXEL_CONSERVATION_COMMON_ANCHOR_BOTH_SIDES"
            echo "transparent_canvas_overflow=ALLOWED"
            echo "missing_or_unsafe_pmd=KEEP_NATIVE_SOULGOLD_BATTLER"
            echo "runtime_visual_status=PENDING_USER_DEFERRED_TESTING"
            if [ -f "${UNIQUE_ROM_PATH}" ]; then
              echo "build_status=PASS"
              stat -c "rom_bytes=%s" "${UNIQUE_ROM_PATH}"
              sha256sum "${UNIQUE_ROM_PATH}"
              python3 - <<'PY'
          import os,zlib
          p=os.environ['UNIQUE_ROM_PATH']; crc=0
          with open(p,'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): crc=zlib.crc32(c,crc)
          print(f"rom_crc32={crc & 0xffffffff:08X}")
          PY
            else
              echo "build_status=FAIL_OR_NO_ROM"
            fi
          } | tee evidence/PMD_G4D_CI_EVIDENCE.txt
      - name: Upload G4D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulgold-pmd-g4d-lossless-single-obj-evidence
          path: |
            evidence/
            soulgold/PMD_G4D_BUILD.log
      - name: Upload G4D ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-PMD-G4D-ROM
          path: soulgold/SoulGold-PMD-G4D.gba
