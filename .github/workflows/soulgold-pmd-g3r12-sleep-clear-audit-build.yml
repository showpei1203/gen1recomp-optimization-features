name: SoulGold PMD G3R12 Sleep Clear Authority Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmd-portable-battle-framework
    paths:
      - "tools/audit_soulgold_g3r12_sleep_clear_paths.py"
      - ".github/workflows/soulgold-pmd-g3r12-sleep-clear-audit-build.yml"

env:
  SOULGOLD_REV: b5122bdf188943862c13abe4938e88b7bb3c5c4a
  SPRITECOLLAB_REV: 4b6b72aacde89abecf8d8e2f6b9e4c8a778570d7
  ROM_PATH: soulgold/Soulgold_Beta_1.gba
  UNIQUE_ROM_PATH: soulgold/SoulGold-PMD-G3R12.gba

jobs:
  compile-g3r12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework
      - name: Checkout pinned SoulGold
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold
      - name: Checkout pinned SpriteCollab
        uses: actions/checkout@v4
        with:
          repository: PMDCollab/SpriteCollab
          ref: ${{ env.SPRITECOLLAB_REV }}
          path: spritecollab
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 python3-pil
      - name: Prepare special-state source assets
        run: |
          python3 framework/tools/prepare_soulgold_g3r10_special_state_assets.py \
            --framework-root framework --spritecollab spritecollab \
            --soulgold soulgold --output g3r12_assets
      - name: Install G3R11 runtime parent
        run: |
          python3 framework/tools/install_soulgold_g3r11_wake_notify.py \
            --framework-root framework --soulgold soulgold \
            --assets-staging g3r12_assets/staging
      - name: Audit all candidate sleep-clear source paths
        run: |
          mkdir -p evidence
          python3 framework/tools/audit_soulgold_g3r12_sleep_clear_paths.py \
            --soulgold soulgold --output evidence/G3R12_SLEEP_CLEAR_PATH_AUDIT.json
          python3 - <<'PY'
          import json
          p=json.load(open('evidence/G3R12_SLEEP_CLEAR_PATH_AUDIT.json'))
          assert p['runtime_change']=='NONE_AUDIT_ONLY_PARENT_G3R11_RUNTIME'
          assert p['g3r11_covered_count'] >= 2
          assert p['sleep_clear_candidate_count'] >= p['g3r11_covered_count']
          print('G3R12 exact-source sleep-clear inventory gate PASS')
          PY
      - name: Verify parent ownership invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('soulgold/src/pmd_soulgold_prototype.c').read_text()
          c=Path('soulgold/src/battle_move_resolution.c').read_text()
          m=Path('soulgold/src/battle_main.c').read_text()
          assert 'PMD_PHASE_WAKE' in p
          assert c.count('PmdSoulGoldPrototype_NotifyWake(ctx->battlerAtk);') == 2
          f=m[m.index('static void RunBattleSoftwareTick(void)\n{'):]
          f=f[:f.index('\n}')+2]
          assert f.index('AnimateSprites();') < f.index('PmdSoulGoldPrototype_Tick();') < f.index('BuildOamBuffer();')
          print('G3R12 preserves G3R11 runtime and G3R4B OAM order')
          PY
      - name: Build SoulGold G3R12
        working-directory: soulgold
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee PMD_G3R12_BUILD.log
      - name: Audit PMD warnings or errors
        run: |
          if grep -E "src/pmd_.*(warning:|error:)" soulgold/PMD_G3R12_BUILD.log; then exit 1; fi
      - name: Verify symbols and ROM
        run: |
          arm-none-eabi-nm -C soulgold/Soulgold_Beta_1.elf | sort > evidence/PMD_G3R12_SYMBOLS.txt
          for required in PmdSoulGoldPrototype_Tick PmdSoulGoldPrototype_NotifyWake; do
            grep -q "${required}$" evidence/PMD_G3R12_SYMBOLS.txt || exit 1
          done
          cp "${ROM_PATH}" "${UNIQUE_ROM_PATH}"
          test "$(stat -c %s "${UNIQUE_ROM_PATH}")" -eq 33554432
      - name: Record G3R12 evidence
        if: always()
        run: |
          mkdir -p evidence/installed_source
          cp soulgold/PMD_G3R11_INSTALL_STATUS.txt evidence/ || true
          cp g3r12_assets/G3R10_SPECIAL_STATE_ASSET_SUMMARY.json evidence/ || true
          cp soulgold/src/battle_move_resolution.c evidence/installed_source/ || true
          cp soulgold/src/pmd_soulgold_prototype.c evidence/installed_source/ || true
          {
            echo "SoulGold PMD G3R12 Sleep Clear Authority evidence"
            echo "framework_commit=${GITHUB_SHA}"
            echo "soulgold_revision=${SOULGOLD_REV}"
            echo "spritecollab_revision=${SPRITECOLLAB_REV}"
            echo "runtime_parent=G3R11"
            echo "runtime_change=NONE_SOURCE_AUDIT_ONLY"
            echo "fallback_policy=AMBIGUOUS_SLEEP_CURES_REMAIN_NATIVE"
            echo "known_ambient_1px_defect=DEFERRED_ROOT_CAUSE_UNRESOLVED"
            echo "runtime_visual_status=PENDING_USER_DEFERRED_TESTING"
            if [ -f "${UNIQUE_ROM_PATH}" ]; then
              echo "build_status=PASS"
              stat -c "rom_bytes=%s" "${UNIQUE_ROM_PATH}"
              sha256sum "${UNIQUE_ROM_PATH}"
              python3 - <<'PY'
          import os,zlib
          p=os.environ['UNIQUE_ROM_PATH']; crc=0
          with open(p,'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): crc=zlib.crc32(c,crc)
          print(f"rom_crc32={crc & 0xffffffff:08X}")
          PY
            else
              echo "build_status=FAIL_OR_NO_ROM"
            fi
          } | tee evidence/PMD_G3R12_CI_EVIDENCE.txt
      - name: Upload G3R12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulgold-pmd-g3r12-build-evidence
          path: |
            evidence/
            soulgold/PMD_G3R12_BUILD.log
      - name: Upload G3R12 ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-PMD-G3R12-ROM
          path: soulgold/SoulGold-PMD-G3R12.gba
