name: SoulGold PMD G3R6B Native Move Attack Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmd-portable-battle-framework
    paths:
      - "tools/convert_soulgold_g3r6b_attack.py"
      - "tools/emit_soulgold_g3r6b_attack_c.py"
      - "tools/prepare_soulgold_g3r6b_assets.py"
      - "tools/install_soulgold_g3r6b.py"
      - "prototype/soulgold_g3r6b/**"
      - ".github/workflows/soulgold-pmd-g3r6b-build.yml"

env:
  SOULGOLD_REV: b5122bdf188943862c13abe4938e88b7bb3c5c4a
  SPRITECOLLAB_REV: 4b6b72aacde89abecf8d8e2f6b9e4c8a778570d7
  ROM_PATH: soulgold/Soulgold_Beta_1.gba
  UNIQUE_ROM_PATH: soulgold/SoulGold-PMD-G3R6B.gba

jobs:
  compile-g3r6b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework

      - name: Checkout pinned SoulGold
        uses: actions/checkout@v4
        with:
          repository: Eemeliri/soulgold
          ref: ${{ env.SOULGOLD_REV }}
          path: soulgold

      - name: Checkout pinned SpriteCollab
        uses: actions/checkout@v4
        with:
          repository: PMDCollab/SpriteCollab
          ref: ${{ env.SPRITECOLLAB_REV }}
          path: spritecollab

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 python3-pil

      - name: Prepare G3R6B Attack assets
        run: |
          python3 framework/tools/prepare_soulgold_g3r6b_assets.py \
            --framework-root framework \
            --spritecollab spritecollab \
            --soulgold soulgold \
            --output g3r6b_assets

      - name: Audit lossless Attack source contract
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('g3r6b_assets/G3R6B_ASSET_SUMMARY.json',encoding='utf-8'))
          assert s['phase']=='G3R6B_ATTACK_BODY_ASSETS'
          assert s['attack_body_policy'].endswith('VISIBLE_PIXELS_100_PERCENT_CONSERVED')
          assert s['known_ambient_1px_defect']=='DEFERRED_ROOT_CAUSE_UNRESOLVED'
          expected={
              'Cyndaquil_player': {'size':[64,72], 'frames':10},
              'Marill_opponent': {'size':[64,80], 'frames':11},
          }
          for key,want in expected.items():
              rec=s['targets'][key]
              assert rec['attack_source_frame_size']==want['size'], (key,rec['attack_source_frame_size'])
              assert rec['attack_frame_count']==want['frames'], (key,rec['attack_frame_count'])
              assert rec['attack_markers']=={'rush':1,'hit':3,'return':6}, (key,rec['attack_markers'])
              assert rec['visible_pixel_conservation'] is True
              assert len(rec['opaque_destination_bboxes'])==want['frames']
              assert len(rec['opaque_pixels'])==want['frames']
              assert all(n>0 for n in rec['opaque_pixels'])
              assert len(rec['attack_shadow_frames'])==want['frames']
              assert rec['expanded_shadow_atlas_frame_count']==20+want['frames'], (key,rec['expanded_shadow_atlas_frame_count'])
              print(key,'Attack',want,'durations',rec['attack_durations'])
          print('G3R6B lossless Attack source contract PASS')
          PY

      - name: Install G3R6B candidate
        run: |
          python3 framework/tools/install_soulgold_g3r6b.py \
            --framework-root framework \
            --soulgold soulgold \
            --assets-staging g3r6b_assets/staging

      - name: Verify move ownership and choreography invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main=Path('soulgold/src/battle_main.c').read_text()
          s=main.index('static void RunBattleSoftwareTick(void)\n{')
          e=main.index('\nstatic void AdvanceBattleFrameRng(void)',s)
          tick=main[s:e]
          assert tick.index('AnimateSprites();') < tick.index('PmdSoulGoldPrototype_Tick();') < tick.index('BuildOamBuffer();') < tick.index('RunTasks();')
          assert tick.count('PmdSoulGoldPrototype_Tick();')==1

          c=Path('soulgold/src/battle_controllers.c').read_text()
          s=c.index('static void Controller_DoMoveAnimation(enum BattlerId battler)\n{')
          e=c.index('\nvoid BtlController_HandleMoveAnimation(enum BattlerId battler)',s)
          fn=c[s:e]
          assert fn.count('PmdSoulGoldPrototype_BeginMoveAction(battler);')==1
          assert fn.count('PmdSoulGoldPrototype_EndMoveAction(battler);')==1
          assert fn.count('PmdSoulGoldPrototype_IsMoveReturnReady(battler)')==1
          assert fn.index('PmdSoulGoldPrototype_BeginMoveAction(battler);') < fn.index('DoMoveAnim(move);')
          assert fn.index('if (!gAnimScriptActive)') < fn.index('PmdSoulGoldPrototype_EndMoveAction(battler);') < fn.index('SetBattlerSpriteAffineMode(ST_OAM_AFFINE_NORMAL);')
          assert fn.index('PmdSoulGoldPrototype_IsMoveReturnReady(battler)') < fn.index('CopyAllBattleSpritesInvisibilities();')
          assert 'InitAndLaunchSpecialAnimation(battler, battler, battler, B_ANIM_MON_TO_SUBSTITUTE);' in fn
          assert 'TrySetBehindSubstituteSpriteBit' in fn
          assert 'BtlController_Complete(battler);' in fn

          a=Path('soulgold/src/pmd_soulgold_adapter.c').read_text()
          assert 'sPmdNativeSpatialOwnership' in a
          assert 'if (battler >= PMD_GBA_MAX_BATTLERS || sPmdNativeSpatialOwnership[battler])' in a
          assert a.count('sPmdNativeSpatialOwnership[battler] = FALSE;') >= 2
          assert 'gSprites[spriteId].x2 = x;' in a and 'gSprites[spriteId].y2 = y;' in a

          p=Path('soulgold/src/pmd_soulgold_prototype.c').read_text()
          assert 'PMD_PHASE_MOVE_ATTACK' in p and 'PMD_PHASE_MOVE_RETURN' in p
          assert 'PmdSoulGold_SetNativeSpatialOwnership(battler, TRUE);' in p
          assert 'PmdGbaRuntime_Bind(battler, profile->attack)' in p
          assert 'profile->shadowAttack' in p

          print('G3R6B native move ownership invariants PASS')
          PY
          grep -q "new_action=ATTACK" soulgold/PMD_G3R6B_INSTALL_STATUS.txt
          grep -q "move_fx_owner=SOULGOLD_NATIVE_DOMOVEANIM" soulgold/PMD_G3R6B_INSTALL_STATUS.txt
          grep -q "move_spatial_owner=SOULGOLD_NATIVE_X2Y2" soulgold/PMD_G3R6B_INSTALL_STATUS.txt
          grep -q "attack_markers=PRESERVED_NOT_YET_USED_AS_DAMAGE_AUTHORITY" soulgold/PMD_G3R6B_INSTALL_STATUS.txt
          grep -q "gPmdCyndaquilPlayerAttackAction" soulgold/src/pmd_cyndaquil_player_attack.c
          grep -q "gPmdMarillOpponentAttackAction" soulgold/src/pmd_marill_opponent_attack.c
          grep -q "gPmdCyndaquilPlayerAttackShadowAction" soulgold/src/pmd_cyndaquil_player_shadow.c
          grep -q "gPmdMarillOpponentAttackShadowAction" soulgold/src/pmd_marill_opponent_shadow.c
          test -z "$(git -C soulgold diff -- src/save.c src/save_failed_screen.c include/save.h)"

      - name: Build SoulGold G3R6B
        working-directory: soulgold
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee PMD_G3R6B_BUILD.log

      - name: Audit PMD warnings or errors
        run: |
          if grep -E "src/pmd_.*(warning:|error:)" soulgold/PMD_G3R6B_BUILD.log; then exit 1; fi

      - name: Verify ELF symbols and ROM
        run: |
          mkdir -p evidence
          arm-none-eabi-nm -C soulgold/Soulgold_Beta_1.elf | sort > evidence/PMD_G3R6B_SYMBOLS.txt
          for required in \
            PmdSoulGoldPrototype_Tick \
            PmdSoulGoldPrototype_HandleHitAnimation \
            PmdSoulGoldPrototype_BeginMoveAction \
            PmdSoulGoldPrototype_EndMoveAction \
            PmdSoulGoldPrototype_IsMoveReturnReady \
            PmdSoulGold_SetNativeSpatialOwnership \
            PmdSoulGoldDynamicShadow_Update \
            PmdGbaRuntime_GetFrameIndex \
            gPmdCyndaquilPlayerAttackAction \
            gPmdCyndaquilPlayerAttackShadowAction \
            gPmdMarillOpponentAttackAction \
            gPmdMarillOpponentAttackShadowAction; do
            grep -q "${required}$" evidence/PMD_G3R6B_SYMBOLS.txt || exit 1
          done
          cp "${ROM_PATH}" "${UNIQUE_ROM_PATH}"
          test "$(stat -c %s "${UNIQUE_ROM_PATH}")" -eq 33554432

      - name: Record G3R6B evidence
        if: always()
        run: |
          mkdir -p evidence/installed_source
          cp g3r6b_assets/G3R6B_ASSET_SUMMARY.json evidence/ || true
          cp soulgold/PMD_G3R6B_INSTALL_STATUS.txt evidence/ || true
          cp soulgold/src/pmd_cyndaquil_player_attack.c evidence/installed_source/ || true
          cp soulgold/src/pmd_marill_opponent_attack.c evidence/installed_source/ || true
          cp soulgold/src/pmd_cyndaquil_player_shadow.c evidence/installed_source/ || true
          cp soulgold/src/pmd_marill_opponent_shadow.c evidence/installed_source/ || true
          cp soulgold/src/pmd_soulgold_prototype.c evidence/installed_source/ || true
          cp soulgold/src/pmd_soulgold_adapter.c evidence/installed_source/ || true
          git -C soulgold diff -- src/battle_main.c src/battle_controllers.c src/battle_controller_player.c src/battle_controller_opponent.c include/pmd_soulgold_prototype.h include/pmd_soulgold_adapter.h > evidence/SOULGOLD_G3R6B_HOST_PATCH.diff || true
          {
            echo "SoulGold PMD G3R6B native move Attack evidence"
            echo "framework_commit=${GITHUB_SHA}"
            echo "soulgold_revision=${SOULGOLD_REV}"
            echo "spritecollab_revision=${SPRITECOLLAB_REV}"
            echo "parent=G3R6A_HURT_BUILD_PASS_RUNTIME_PENDING"
            echo "new_action=ATTACK"
            echo "attack_pixels=LOSSLESS_VISIBLE_100_PERCENT"
            echo "attack_shadow=FRAME_SYNCHRONOUS_PMDCOLLAB"
            echo "move_fx_owner=SOULGOLD_NATIVE_DOMOVEANIM"
            echo "move_spatial_owner=SOULGOLD_NATIVE_X2Y2"
            echo "pmd_move_role=BODY_PIXELS_PLUS_AUTHENTIC_SHADOW"
            echo "attack_markers=PRESERVED_RUSH1_HIT3_RETURN6_NOT_DAMAGE_AUTHORITY"
            echo "return_policy=NATIVE_SCRIPT_END_THEN_PMD_HOME_BEFORE_CONTROLLER_RELEASE"
            echo "known_ambient_1px_defect=DEFERRED_ROOT_CAUSE_UNRESOLVED"
            echo "runtime_visual_status=PENDING_USER_ACCEPTANCE"
            if [ -f "${UNIQUE_ROM_PATH}" ]; then
              echo "build_status=PASS"
              stat -c "rom_bytes=%s" "${UNIQUE_ROM_PATH}"
              sha256sum "${UNIQUE_ROM_PATH}"
              python3 - <<'PY'
          import os,zlib
          p=os.environ['UNIQUE_ROM_PATH']; crc=0
          with open(p,'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): crc=zlib.crc32(c,crc)
          print(f"rom_crc32={crc & 0xffffffff:08X}")
          PY
            else
              echo "build_status=FAIL_OR_NO_ROM"
            fi
          } | tee evidence/PMD_G3R6B_CI_EVIDENCE.txt

      - name: Upload G3R6B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulgold-pmd-g3r6b-build-evidence
          path: |
            evidence/
            soulgold/PMD_G3R6B_BUILD.log

      - name: Upload G3R6B test ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-PMD-G3R6B-ROM
          path: soulgold/SoulGold-PMD-G3R6B.gba
