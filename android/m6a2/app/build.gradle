plugins { id 'com.android.application' }

android {
    namespace 'com.showpei.soulgold.m6a2'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.showpei.soulgold.m6a2'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName 'M6A2-FIX1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O2 -fno-exceptions -fno-rtti' }
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            // M6A2 FIX1: force legacy JNI packaging so PackageManager extracts
            // libmgba_libretro.so into ApplicationInfo.nativeLibraryDir.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
