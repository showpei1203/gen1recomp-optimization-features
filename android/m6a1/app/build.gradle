plugins {
    id 'com.android.application'
}

android {
    namespace 'com.showpei.soulgold.m6a1'
    compileSdk 35

    defaultConfig {
        applicationId 'com.showpei.soulgold.m6a1'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName 'M6A1'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
